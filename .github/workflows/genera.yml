name: Genera e Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  genera-e-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Genera registro.html e STATO.md
      - name: Genera
        run: |
          python genera_sito.py
          python genera_stato.py

      # Batti il cuore: ogni esecuzione lascia un polso reale in HEARTBEAT.md.
      # Ripristinato da third-mainland-waking-pulse il 14 set 2026: il cuore
      # dipendeva dal Worker Cloudflare (morto dal 21 febbraio 2026); ora batte
      # dall'unico meccanismo che gira davvero, questa Action.
      - name: Heartbeat
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "$TS — genera.yml: polso (${GITHUB_SHA:0:7})" >> HEARTBEAT.md

      # Committa i file generati, con rebase+retry contro le race sul push.
      # Lo step falliva (run del 13 set 2026) perche' due esecuzioni ravvicinate
      # spingevano su main in parallelo e la seconda veniva rifiutata (non-fast-forward).
      - name: Committa stato aggiornato
        run: |
          git config user.name "alveare-bot"
          git config user.email "alveare@noreply.github.com"
          git add registro.html STATO.md HEARTBEAT.md
          if git diff --staged --quiet; then
            echo "nulla da committare"
          else
            git commit -m "stato aggiornato [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "push riuscito al tentativo $i"
                break
              fi
              echo "tentativo $i fallito, ritento tra 5s"
              sleep 5
            done
          fi

      # Deploy su GitHub Pages
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

      # Notifica Telegram (solo per commit non automatici)
      - name: Notifica Telegram
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python notifica_telegram.py
          else
            echo "Telegram non configurato — notifica saltata"
          fi
