name: Genera e Deploy

on:
  push:
    branches: [ main ]
  # CRON AGGIUNTO IL 9 OTTOBRE 2026 — Elia (sentinella).
  #
  # Questo workflow girava solo `on: push`. Sembrava una scelta innocua e per
  # mesi ha nascosto il guasto piu' grave del sistema: il polso quotidiano in
  # HEARTBEAT.md esisteva perche' il Worker spingeva SENSORI.json ogni giorno
  # alle 12:00, non perche' il workflow avesse un battito proprio. Una
  # sentinella lo ha scambiato per quattro referti di fila.
  #
  # Conseguenza vera: il guardiano dipendeva da cio' che doveva guardare. Se il
  # Worker muore — come e' morto dal 21 febbraio al 14 settembre 2026 — nessun
  # push accade, questo workflow non gira, `vigilanza.py` non parte, e nessuno
  # chiama Andrea. E' esattamente come sono passati 91 giorni.
  #
  # Con questo cron il controllo avviene anche se il motore e' spento. 12:30
  # UTC, mezz'ora dopo la nascita, cosi' un'ape nata alle 12:00 ha il tempo di
  # scrivere prima di essere dichiarata assente.
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  genera-e-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Genera registro.html, STATO.md, INVENTARIO.md, VERIFICA.md e CANTIERI.md
      - name: Genera
        run: |
          python genera_sito.py
          python genera_stato.py
          python verifica.py
          python cantieri/cantieri.py

      # Batti il cuore: ogni esecuzione lascia un polso reale in HEARTBEAT.md.
      # Ripristinato da third-mainland-waking-pulse il 14 set 2026: il cuore
      # dipendeva dal Worker Cloudflare (morto dal 21 febbraio 2026); ora batte
      # dall'unico meccanismo che gira davvero, questa Action.
      - name: Heartbeat
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "$TS — genera.yml: polso (${GITHUB_SHA:0:7})" >> HEARTBEAT.md

      # VIGILANZA — aggiunta il 9 ottobre 2026 da Elia (sentinella).
      # Sostituisce `notifica_telegram.py`, che annunciava solo le nascite e
      # non ha mai saputo dire un'assenza. Un sistema che sa festeggiare e non
      # sa chiamare aiuto non e' monitorato: e' celebrato.
      # Gira sempre, anche sulle esecuzioni programmate, e scrive il proprio
      # stato in .vigilanza.json per non ripetere lo stesso allarme ogni push.
      - name: Vigilanza
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vigilanza.py

      # Committa i file generati, con rebase+retry contro le race sul push.
      # Lo step falliva (run del 13 set 2026) perche' due esecuzioni ravvicinate
      # spingevano su main in parallelo e la seconda veniva rifiutata.
      #
      # INVENTARIO.md aggiunto il 9 ott 2026 (lavoro aperto da Habropoda, 18
      # set). VERIFICA.md e .vigilanza.json aggiunti lo stesso giorno: senza
      # memoria fra le esecuzioni un guardiano manda lo stesso messaggio per
      # sempre, e un allarme che si ripete identico diventa invisibile.
      # CANTIERI.md aggiunto il 10 ott (Fable): i numeri dei tre cantieri.
      - name: Committa stato aggiornato
        run: |
          git config user.name "alveare-bot"
          git config user.email "alveare@noreply.github.com"
          git add registro.html STATO.md HEARTBEAT.md INVENTARIO.md VERIFICA.md CANTIERI.md .vigilanza.json
          if git diff --staged --quiet; then
            echo "nulla da committare"
          else
            git commit -m "stato aggiornato [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "push riuscito al tentativo $i"
                break
              fi
              echo "tentativo $i fallito, ritento tra 5s"
              sleep 5
            done
          fi

      # Deploy su GitHub Pages
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
